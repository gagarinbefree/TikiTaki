<div
  #container
  [class]="text.viewport"
  [style.width]="geometry.viewport.width"
  [style.aspect-ratio]="geometry.viewport.aspectRatio"
  [style.position]="geometry.viewport.position"
  [style.inset]="geometry.viewport.inset"
  [style.height]="geometry.viewport.height"
  [style.z-index]="geometry.viewport.zIndex"
  [style.border-radius]="geometry.viewport.borderRadius"
  [style.border-width]="geometry.viewport.borderWidth"
  data-demo-container=""
  [attr.aria-label]="text.viewportLabel"
></div>
<ng-template #cell let-item let-position="position"><tikitaki-angular-cell [item]="item" [position]="position" /></ng-template>
