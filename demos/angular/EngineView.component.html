<div
  #container
  [class]="fullscreen() ? mobileLayout.viewport : text.viewport"
  [style.width]="fullscreen() ? null : geometry.viewport.width"
  [style.aspect-ratio]="fullscreen() ? null : geometry.viewport.aspectRatio"
  data-demo-container=""
  [attr.aria-label]="text.viewportLabel"
></div>
<ng-template #cell let-item let-position="position"
  ><tikitaki-angular-cell [fullscreen]="fullscreen()" [item]="item" [position]="position"
/></ng-template>
