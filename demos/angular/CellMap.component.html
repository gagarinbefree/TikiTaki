@if (!fullscreen()) {
  <div [class]="text.gridMapHeader">
    <span [class]="text.gridMapLegend">{{ text.currentCellLegend }}</span>
  </div>
  <p [class]="text.hint">{{ text.cellMapHint }}</p>
}
<div [class]="fullscreen() ? mobileLayout.rows : text.gridMapScroll">
  @for (cells of rows(); track $index; let row = $index) {
    <p
      [class]="fullscreen() ? mobileLayout.row : text.gridMapRow"
      [attr.data-map-row]="row"
      role="group"
      [attr.aria-label]="labels.row(row)"
    >
      @for (cell of cells; track cell.position.col) {
        <button
          type="button"
          [class]="
            fullscreen()
              ? cell.current
                ? mobileLayout.currentCell
                : mobileLayout.cell
              : cell.current
                ? text.gridMapCurrentCell
                : text.gridMapCell
          "
          [attr.data-bs-target]="fullscreen() ? '' : null"
          [disabled]="!enabled()"
          [title]="labels.coordinates(cell.position)"
          [attr.aria-current]="cell.current ? text.true : null"
          (click)="selectCell.emit(cell.position)"
        >
          <span [class]="fullscreen() ? mobileLayout.label : ''">{{ cell.label }}</span>
        </button>
      }
    </p>
  }
</div>
