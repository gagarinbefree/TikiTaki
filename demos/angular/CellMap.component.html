<div [class]="text.gridMapHeader">
  <span [class]="text.gridMapLegend">{{ text.currentCellLegend }}</span>
</div>
<p [class]="text.hint">{{ text.cellMapHint }}</p>
<div [class]="text.gridMapScroll" [style]="geometry.mapRows">
  @for (cells of rows(); track $index; let row = $index) {
    <p [class]="text.gridMapRow" [style]="geometry.mapRow" [attr.data-map-row]="row" role="group" [attr.aria-label]="labels.row(row)">
      @for (cell of cells; track cell.position.col) {
        <button
          type="button"
          [class]="cell.current ? text.gridMapCurrentCell : text.gridMapCell"
          [style]="geometry.mapCell"
          [style.width]="cell.current ? geometry.mapCurrentCell.width : geometry.mapCell.width"
          [style.height]="cell.current ? geometry.mapCurrentCell.height : geometry.mapCell.height"
          [disabled]="!enabled()"
          [title]="labels.coordinates(cell.position)"
          [attr.aria-current]="cell.current ? text.true : null"
          (click)="selectCell.emit(cell.position)"
        >
          {{ cell.label }}
        </button>
      }
    </p>
  }
</div>
