name: Tests, build and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test
      - name: Build library and adapters; verify the packaged core
        run: npm run test:package
      - name: Build production demos for the Pages project path
        run: npm run demo:build
      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Chrome desktop, touch and Pages project-path tests
        run: npx playwright test
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-failure-diagnostics
          path: |
            test-results/
            .artifacts/chrome.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the tested Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demos/dist

  deploy:
    name: Deploy demos
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
