name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test
      - name: Build library and adapters; verify the packaged core
        run: npm run test:package
      - name: Build production demos for the Pages project path
        run: npm run demo:build
      - name: Install Google Chrome and system dependencies
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx playwright install --with-deps chrome
          fi
      - name: Chrome desktop, touch and Pages project-path tests
        run: npx playwright test
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-failure-diagnostics
          path: |
            test-results/
            .artifacts/chrome.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Upload the tested demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-demo
          path: demos/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true
