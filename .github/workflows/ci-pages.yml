name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test
      - name: Build library and adapters; verify the packaged core
        run: npm run test:package
      - name: Build production demos for the Pages project path
        run: npm run demo:build
      - name: Install Google Chrome and system dependencies
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx playwright install --with-deps chrome
          fi
      - name: Chrome desktop, touch and Pages project-path tests
        run: npx playwright test
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-failure-diagnostics
          path: |
            test-results/
            .artifacts/chrome.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload the tested demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-demo
          path: demos/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  prepare-release:
    name: Prepare release version
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-demo
          path: demos/dist
      - name: Prepare the deployment metadata
        id: version
        run: |
          RELEASE_TAGS=$(gh release list --limit 100 --json tagName)
          export RELEASE_TAGS
          node scripts/stamp-deployment.mjs
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-demo
          path: demos/dist
          if-no-files-found: error
          overwrite: true

  web-pages:
    name: Deploy demo to Pages
    needs: [build-and-test, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      page-url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: prepared-demo
          path: demos/dist
      - name: Assign the next stable release version
        id: version
        run: |
          RELEASE_TAGS=$(gh release list --limit 100 --json tagName)
          export RELEASE_TAGS
          node scripts/stamp-deployment.mjs
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: demos/dist
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assemble release downloads
        run: |
          mkdir -p release-assets
          cp demos/dist/version.json release-assets/
          (cd demos/dist && zip -qr "$GITHUB_WORKSPACE/release-assets/tikitaki-demo.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release-assets
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [prepare-release, web-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.web-pages.outputs.version }}
          path: release-assets
      - name: Create GitHub Release for the deployed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.web-pages.outputs.version }}
          DEMO_URL: ${{ needs.web-pages.outputs.page-url }}
        run: |
          printf 'Demo: %s\n\nSource commit: %s\n' "$DEMO_URL" "$GITHUB_SHA" > release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-assets/* --clobber
            gh release edit "v$VERSION" --prerelease=false --latest
          else
            gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "TikiTaki v$VERSION" --notes-file release-notes.md --latest
          fi
      - name: Update the latest release in README
        env:
          VERSION: ${{ needs.web-pages.outputs.version }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          node scripts/update-readme-release.mjs "$VERSION"
          git add README.md docs/badges/release.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update release version to v$VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
