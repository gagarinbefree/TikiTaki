name: Build and Pages

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: build-pages-main
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build library and optional adapters
        run: npm run build
      - name: Download the exact demo verified by Chrome
        uses: actions/download-artifact@v8
        with:
          name: verified-demo
          path: demos/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Store the verified deployment input
        uses: actions/upload-artifact@v7
        with:
          name: built-demo
          path: demos/dist
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy demos
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment tooling from the tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the verified deployment input
        uses: actions/download-artifact@v8
        with:
          name: built-demo
          path: demos/dist
      - name: Assign a new version to this deployment attempt
        run: node scripts/stamp-deployment.mjs
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload this version of the tested demo
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: demos/dist
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
